    <script>
      // 1. Fix for GitHub Pages sub-directory hosting without trailing slash
      // e.g. https://username.github.io/repo -> https://username.github.io/repo/
      (function() {
        var path = window.location.pathname;
        if (path && !path.endsWith('/') && !path.split('/').pop().includes('.')) {
          window.location.replace(
            window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash
          );
        }
      })();

      // 2. Fallback protection if uncompiled root index.html is loaded directly on GitHub Pages
      window.addEventListener('error', function(event) {
        if ((event.filename && event.filename.indexOf('.tsx') !== -1) || (event.message && event.message.indexOf('module') !== -1)) {
          var root = document.getElementById('root');
          if (root && (!root.innerHTML || root.innerHTML.trim() === '')) {
            var currentPath = window.location.pathname.replace(/\/$/, '');
            var docsUrl = currentPath + '/docs/';
            // Try auto-redirecting to /docs/ where precompiled build is placed
            if (!currentPath.endsWith('/docs') && !currentPath.endsWith('/dist')) {
              window.location.replace(docsUrl);
            }
          }
        }
      });
    </script>
